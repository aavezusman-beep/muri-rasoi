<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<title>Photo Gallery | Vaishnavi Banquet, Silli, Ranchi</title>
<meta name="description" content="Photos of Vaishnavi Banquet in Silli, Ranchi: entrance, decorated stages and the food court area.">
</head>
<body data-page="gallery" data-file="gallery.html">
<div id="site-header"></div>
<main id="main">
<section style="padding-bottom:1rem"><div class="wrap center">
  <p class="eyebrow">Gallery</p><h1>Photo Gallery</h1>
  <p class="lead">Photographs of the venue and its decorations. Click any photo to enlarge it.</p>
  <div id="gallery-note"></div>
  <div class="filters" id="gallery-filters"></div>
</div></section>
<section style="padding-top:1rem"><div class="wrap"><div class="gallery" id="gallery"><div class="empty">Loading photos…</div></div></div></section>
</main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="close" aria-label="Close">&times;</button>
  <button class="prev" aria-label="Previous photo" style="position:absolute;left:12px;background:none;border:0;color:#fff;font-size:2.4rem;cursor:pointer">&lsaquo;</button>
  <img alt="">
  <button class="next" aria-label="Next photo" style="position:absolute;right:12px;background:none;border:0;color:#fff;font-size:2.4rem;cursor:pointer">&rsaquo;</button>
  <div class="cap"></div>
</div>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/common.js"></script>
<script src="js/pages.js"></script>
</body></html>
