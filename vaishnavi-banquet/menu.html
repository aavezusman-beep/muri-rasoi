<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<title>Restaurant Menu | VR Vaishnavi Restaurant, Silli, Ranchi</title>
<meta name="description" content="Browse the VR Vaishnavi Restaurant menu. Search dishes, filter vegetarian options and send a WhatsApp enquiry.">
</head>
<body data-page="menu" data-file="menu.html">
<div id="site-header"></div>
<main id="main">
<section style="padding-bottom:1rem"><div class="wrap center">
  <p class="eyebrow">VR Vaishnavi Restaurant</p><h1>Digital Menu</h1>
  <p class="lead">Search dishes, filter by category, and tap any dish for details. Ordering here sends an enquiry. It is not confirmed until the restaurant confirms it.</p>
  <div id="menu-note"></div>
  <input id="menu-search" class="menu-search" type="search" placeholder="Search dishes" aria-label="Search dishes">
  <div class="filters" id="menu-filters"></div>
  <label style="display:inline-flex;gap:.5rem;align-items:center;font-size:.9rem"><input type="checkbox" id="menu-veg"> Vegetarian only</label>
</div></section>
<section style="padding-top:1rem"><div class="wrap">
  <div class="menu-list" id="menu-list"><div class="empty">Loading menu…</div></div>
  <div id="cart" class="cart-bar" aria-live="polite"></div>
</div></section>
</main>
<div class="modal" id="dish-modal" role="dialog" aria-modal="true" aria-label="Dish details">
  <div class="modal-box"><button class="x" aria-label="Close" onclick="this.closest('.modal').classList.remove('open')">&times;</button><div class="modal-body"></div></div>
</div>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/common.js"></script>
<script src="js/pages.js"></script>
</body></html>
